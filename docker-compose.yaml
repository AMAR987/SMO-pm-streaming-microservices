services:
  redis:
    image: redis:7-alpine
    container_name: hv-ves-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - hv-ves-net

  message-router-zookeeper:
    image: bitnamilegacy/zookeeper:3.9
    container_name: message-router-zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    restart: unless-stopped
    networks:
      - hv-ves-net

  message-router-kafka-0:
    image: bitnamilegacy/kafka:3.7.0
    container_name: message-router-kafka-0
    depends_on:
      - message-router-zookeeper
    environment:
      KAFKA_ENABLE_KRAFT: "no"
      KAFKA_CFG_BROKER_ID: "1"
      KAFKA_CFG_ZOOKEEPER_CONNECT: message-router-zookeeper:2181

      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://message-router-kafka-0:9092,EXTERNAL://10.1.3.85:29093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CLIENT_USERS: admin
      KAFKA_CLIENT_PASSWORDS: admin_secret

      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DELETE_TOPIC_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "1"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      ALLOW_PLAINTEXT_LISTENER: "no"
    ports:
      - "29093:9093"
    volumes:
      - kafka-data:/bitnami/kafka
    restart: unless-stopped
    networks:
      - hv-ves-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui1
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: hv-ves
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: message-router-kafka-0:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin_secret";'
    depends_on:
      - message-router-kafka-0
    networks:
      - hv-ves-net

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: hv-ves-fastapi
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      CONNECTION_TTL: "300"
      KAFKA_BOOTSTRAP_SERVERS: message-router-kafka-0:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_USERNAME: admin
      KAFKA_PASSWORD: admin_secret
      PERF_KAFKA_TOPIC: HV_VES_PERF3GPP
      LOG_KAFKA_TOPIC: HV_VES_PROPRIETARY
    depends_on:
      redis:
        condition: service_healthy
      message-router-kafka-0:
        condition: service_started

    restart: unless-stopped
    networks:
      - hv-ves-net
  decoder:
    build: ./decoder
    container_name: decoder
    environment:
       KAFKA_BOOTSTRAP_SERVERS: message-router-kafka-0:9092
       INPUT_TOPIC: HV_VES_PERF3GPP
       OUTPUT_TOPIC: DECODED_PERF
       CONSUMER_GROUP_ID: perf3gpp-decoder-group

volumes:
  redis-data:
  kafka-data:
  zookeeper-data:

networks:
  hv-ves-net:
    driver: bridge

