

services:
  n-writer:
    build: .
    container_name: n-writer
    working_dir: /app

    environment:
      KAFKA_BOOTSTRAP_SERVERS: "10.1.3.85:29093"
      KAFKA_GROUP_ID: "n-writer-decoded-perf-group"
      KAFKA_TOPIC: "DECODED_PERF"
      KAFKA_USERNAME: "admin"
      KAFKA_PASSWORD: "admin_secret"

      INFLUX_URL: "http://influxdb:8086"
      INFLUX_TOKEN: "RUVu5qHGRw9EuTl61-7eIhryXa6A31DzH0y7NGii9HrIBdLbv29h3pjzj14z6gPlT_u9qNFGI1ZtioIEpaqgPw=="
      INFLUX_ORG: "org"
      INFLUX_BUCKET: "bucket"

      PYTHONUNBUFFERED: "1"

    restart: unless-stopped
    depends_on:
      - influxdb
    networks:
      - hv-ves-net

  influxdb:
    image: influxdb:2
    container_name: influxdb

    ports:
      - "8086:8086"

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "saikiran45"
      DOCKER_INFLUXDB_INIT_PASSWORD: "sai@2426"
      DOCKER_INFLUXDB_INIT_ORG: "org"
      DOCKER_INFLUXDB_INIT_BUCKET: "bucket"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "RUVu5qHGRw9EuTl61-7eIhryXa6A31DzH0y7NGii9HrIBdLbv29h3pjzj14z6gPlT_u9qNFGI1ZtioIEpaqgPw=="

    volumes:
      - ./influxdb2-config:/etc/influxdb2
      - ./influxdb2-data:/var/lib/influxdb2

    restart: unless-stopped
    networks:
      - hv-ves-net

volumes:
  influxdb2-config:
  influxdb2-data:

networks:
  hv-ves-net:
    driver: bridge
