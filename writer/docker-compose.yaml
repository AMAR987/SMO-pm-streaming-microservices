
services:

  n-writer:
    
    build: .
    container_name: n-writer
    working_dir: /app

    environment:
      KAFKA_BOOTSTRAP_SERVERS: 10.1.3.85:29093
      KAFKA_GROUP_ID: n-writer-decoded-perf-group
      KAFKA_TOPIC: DECODED_PERF
      KAFKA_USERNAME: admin
      KAFKA_PASSWORD: admin_secret

      INFLUX_URL: http://host.docker.internal:8086

      PYTHONUNBUFFERED: "1"

    extra_hosts:
      - "host.docker.internal:host-gateway"


    restart: unless-stopped

    networks:
      - hv-ves-net

  
networks:
  hv-ves-net:
    driver: bridge
