
services:

  n-writer:
    
    build: .
    container_name: n-writer
    working_dir: /app

    environment:
      KAFKA_BOOTSTRAP_SERVERS: 10.1.3.85:29093
      KAFKA_GROUP_ID: n-writer-decoded-perf-group
      KAFKA_TOPIC: DECODED_PERF
      KAFKA_USERNAME: admin
      KAFKA_PASSWORD: admin_secret

      INFLUX_URL: http://influxdb:8086

      PYTHONUNBUFFERED: "1"

    extra_hosts:
      - "host.docker.internal:host-gateway"


    restart: unless-stopped

    networks:
      - hv-ves-net

  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb2-config:/etc/influxdb2
      - influxdb2-data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - hv-ves-net

volumes:
  influxdb2-config:
    external: true
  influxdb2-data:
    external: true

  
networks:
  hv-ves-net:
    driver: bridge
