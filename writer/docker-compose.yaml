
services:

  # ---------------- ZOOKEEPER ----------------
  message-router-zookeeper:
    image: bitnamilegacy/zookeeper:3.9
    container_name: message-router-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - hv-ves-net

  # ---------------- KAFKA ----------------
  message-router-kafka-0:
    image: bitnamilegacy/kafka:3.7.0
    container_name: message-router-kafka-0
    depends_on:
      - message-router-zookeeper

    environment:
      - KAFKA_ENABLE_KRAFT=no
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=message-router-zookeeper:2181

      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://message-router-kafka-0:9092,EXTERNAL://localhost:29093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CLIENT_USERS=admin
      - KAFKA_CLIENT_PASSWORDS=admin_secret

      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=1
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1

      - KAFKA_CFG_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin_secret" user_admin="admin_secret";
      - KAFKA_CFG_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required user_admin="admin_secret";

      - ALLOW_PLAINTEXT_LISTENER=no

    ports:
      - "29093:9094"

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - hv-ves-net

  # ---------------- N-WRITER ----------------
  n-writer:
    image: python:3.10-slim
    container_name: n-writer
    working_dir: /app

    volumes:
      - .:/app

    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -u main.py"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: message-router-kafka-0:9092
      KAFKA_GROUP_ID: n-writer-test-group
      KAFKA_TOPIC: writer-test-topic
      KAFKA_USERNAME: admin
      KAFKA_PASSWORD: admin_secret

      INFLUX_URL: http://host.docker.internal:8086

      PYTHONUNBUFFERED: "1"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      message-router-kafka-0:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - hv-ves-net

  # ---------------- KAFKA SIMULATOR ----------------
  kafka-simulator:
    image: python:3.10-slim
    container_name: kafka-simulator
    working_dir: /app/test/kafka-simulator

    volumes:
      - .:/app

    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -u main.py"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: message-router-kafka-0:9092
      KAFKA_TOPIC: writer-test-topic
      KAFKA_USERNAME: admin
      KAFKA_PASSWORD: admin_secret
      MESSAGE_COUNT: 10
      MESSAGE_INTERVAL: 1

      PYTHONUNBUFFERED: "1"

    depends_on:
      message-router-kafka-0:
        condition: service_healthy

    networks:
      - hv-ves-net

# ---------------- NETWORK ----------------
networks:
  hv-ves-net:
    driver: bridge
